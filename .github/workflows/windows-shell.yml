name: Windows shell build
on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-shell.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-shell.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build WPF shell
        run: dotnet build windows/DroidBox.Windows.csproj --configuration Release
      - name: Publish self-contained Windows x64 preview
        if: github.event_name != 'pull_request'
        run: dotnet publish windows/DroidBox.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/DroidBox-win-x64
      - name: Bundle Python APK inspector
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "artifacts/DroidBox-win-x64"
          $pythonZip = "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/$pythonZip" -OutFile $pythonZip
          $pythonDir = Join-Path $root "python"
          New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
          Expand-Archive $pythonZip -DestinationPath $pythonDir -Force
          $scriptsDir = Join-Path $root "scripts"
          New-Item -ItemType Directory -Force -Path $scriptsDir | Out-Null
          Copy-Item "scripts/*" $scriptsDir -Recurse -Force
          if (-not (Test-Path (Join-Path $scriptsDir "apk_inspector.py"))) {
            throw "APK inspector source was not copied into the preview."
          }
          $pth = Join-Path $pythonDir "python312._pth"
          if (-not (Test-Path $pth)) { throw "Embedded Python path configuration was not found." }
          $rootFull = (Resolve-Path $root).Path
          $lines = Get-Content $pth
          if ($lines -notcontains $rootFull) { Add-Content -Path $pth -Value $rootFull }
          $pythonExe = Join-Path $pythonDir "python.exe"
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Python failed to start." }
          $pythonExe = (Resolve-Path $pythonExe).Path
          $probeCode = "import runpy,sys; sys.path.insert(0, sys.argv.pop(1)); runpy.run_module('scripts.apk_inspector', run_name='__main__')"
          & $pythonExe -c $probeCode $rootFull --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled APK inspector failed to load (exit code $LASTEXITCODE)." }
      - name: Package preview
        if: github.event_name != 'pull_request'
        run: Compress-Archive -Path artifacts/DroidBox-win-x64/* -DestinationPath artifacts/DroidBox-win-x64-preview.zip
        shell: pwsh
      - name: Upload Windows preview
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DroidBox-Windows-x64-preview
          path: artifacts/DroidBox-win-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
