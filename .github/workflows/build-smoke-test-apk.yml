name: Build DroidBox smoke-test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime-test-app/**'
      - '.github/workflows/build-smoke-test-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: runtime-test-app
      - uses: actions/upload-artifact@v4
        with:
          name: droidbox-smoke-test-apk
          path: runtime-test-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
