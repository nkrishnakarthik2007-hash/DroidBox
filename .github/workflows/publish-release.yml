name: Build and publish DroidBox updates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidbox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate NKK application icon
        run: python scripts/create_windows_icon.py

      - name: Build and test WPF application
        run: dotnet build windows/DroidBox.Windows.csproj --configuration Release

      - name: Publish self-contained Windows x64 application
        run: dotnet publish windows/DroidBox.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/DroidBox-win-x64

      - name: Bundle the APK inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "artifacts/DroidBox-win-x64"
          $pythonZip = "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/$pythonZip" -OutFile $pythonZip
          $pythonDir = Join-Path $root "python"
          New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
          Expand-Archive $pythonZip -DestinationPath $pythonDir -Force
          $scriptsDir = Join-Path $root "scripts"
          New-Item -ItemType Directory -Force -Path $scriptsDir | Out-Null
          Copy-Item "scripts/*" $scriptsDir -Recurse -Force
          if (-not (Test-Path (Join-Path $scriptsDir "apk_inspector.py"))) { throw "APK inspector source missing." }
          $pth = Join-Path $pythonDir "python312._pth"
          if (-not (Test-Path $pth)) { throw "Embedded Python path configuration missing." }
          $rootFull = (Resolve-Path $root).Path
          $lines = Get-Content $pth
          if ($lines -notcontains $rootFull) { Add-Content -Path $pth -Value $rootFull }
          $pythonExe = (Resolve-Path (Join-Path $pythonDir "python.exe")).Path
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Python failed to start." }
          $probeCode = "import runpy,sys; sys.path.insert(0, sys.argv.pop(1)); runpy.run_module('scripts.apk_inspector', run_name='__main__')"
          & $pythonExe -c $probeCode $rootFull --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled APK inspector failed its startup check." }


      - name: Bundle the Stubuika Windows x64 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uri = "https://github.com/flessan/stubuika/releases/download/stubuika-v2026.11.08/stubuika-2026-11-08-windows-x86_64.zip"
          Invoke-WebRequest -Uri $uri -OutFile stubuika.zip
          if ((Get-Item stubuika.zip).Length -lt 10000000) { throw "Stubuika archive is unexpectedly small." }
          Expand-Archive stubuika.zip -DestinationPath runtime-source -Force
          $exe = Get-ChildItem runtime-source -Recurse -Filter stubuika.exe | Select-Object -First 1
          if (-not $exe) { throw "stubuika.exe missing from upstream archive." }
          $runtimeRoot = Join-Path (Resolve-Path "artifacts/DroidBox-win-x64").Path "runtime/Stubuika"
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") $runtimeRoot -Recurse -Force
          $hbZip = "harfbuzz-win64-10.2.0.zip"
          Invoke-WebRequest -Uri "https://github.com/harfbuzz/harfbuzz/releases/download/10.2.0/$hbZip" -OutFile $hbZip
          Expand-Archive $hbZip -DestinationPath harfbuzz-source -Force
          $dlls = Get-ChildItem harfbuzz-source -Recurse -Filter *.dll
          if (-not ($dlls | Where-Object Name -eq "libharfbuzz-0.dll")) { throw "HarfBuzz DLL missing." }
          Copy-Item $dlls.FullName $runtimeRoot -Force
          $licenses = Join-Path $runtimeRoot "licenses"
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/flessan/stubuika/master/LICENSE" -OutFile (Join-Path $licenses "Stubuika-MPL-2.0.txt")
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/harfbuzz/harfbuzz/10.2.0/COPYING" -OutFile (Join-Path $licenses "HarfBuzz-COPYING")
          $fonts = Join-Path $runtimeRoot "fonts"
          New-Item -ItemType Directory -Force -Path $fonts | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Berry-OS/luna-ui/master/fonts/Inter-Regular.ttf" -OutFile (Join-Path $fonts "Inter-Regular.ttf")
          Copy-Item (Join-Path $fonts "Inter-Regular.ttf") (Join-Path $fonts "Inter-Bold.ttf") -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/rsms/inter/master/LICENSE.txt" -OutFile (Join-Path $licenses "Inter-OFL.txt")
          @(
            "Bundled runtime: Stubuika Windows x86_64 release stubuika-v2026.11.08",
            "Stubuika is licensed under Mozilla Public License 2.0. Source: https://github.com/flessan/stubuika",
            "Stubuika is a downstream fork of Lunaria. Preserve upstream notices.",
            "HarfBuzz 10.2.0 and Inter font licence notices are in licenses/.",
            "This experimental backend has not passed the DroidBox APK rendering acceptance test.",
            "APK execution is not sandboxed. Only run trusted APKs."
          ) | Set-Content (Join-Path $runtimeRoot "THIRD-PARTY-NOTICES.txt")
          if (-not (Test-Path (Join-Path $runtimeRoot "stubuika.exe"))) { throw "Bundled runtime executable missing." }
          "Bundled Stubuika runtime and third-party notices."

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          $toolPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $toolPath
          $env:PATH += ";$toolPath"
          vpk --help

      - name: Package installable and updateable DroidBox
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.1.${{ github.run_number }}"
          vpk pack --packId NKK.DroidBox --packTitle "NKK DroidBox" --packAuthors "NKK" --icon windows/Assets/DroidBox.ico --packVersion $version --packDir artifacts/DroidBox-win-x64 --mainExe DroidBox.Windows.exe --outputDir artifacts/velopack --channel win --shortcuts Desktop,StartMenuRoot
          if (-not (Test-Path "artifacts/velopack/releases.win.json")) { throw "Velopack release feed was not generated." }
          if (-not (Get-ChildItem "artifacts/velopack" -Filter "*Setup.exe")) { throw "Velopack installer was not generated." }


