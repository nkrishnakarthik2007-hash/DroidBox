name: Build and publish DroidBox updates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: droidbox-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate NKK application icon
        run: python scripts/create_windows_icon.py

      - name: Build and test WPF application
        run: dotnet build windows/DroidBox.Windows.csproj --configuration Release

      - name: Publish self-contained Windows x64 application
        run: dotnet publish windows/DroidBox.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/DroidBox-win-x64

      - name: Bundle the APK inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "artifacts/DroidBox-win-x64"
          $pythonZip = "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/$pythonZip" -OutFile $pythonZip
          $pythonDir = Join-Path $root "python"
          New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
          Expand-Archive $pythonZip -DestinationPath $pythonDir -Force
          $scriptsDir = Join-Path $root "scripts"
          New-Item -ItemType Directory -Force -Path $scriptsDir | Out-Null
          Copy-Item "scripts/*" $scriptsDir -Recurse -Force
          if (-not (Test-Path (Join-Path $scriptsDir "apk_inspector.py"))) { throw "APK inspector source missing." }
          $pth = Join-Path $pythonDir "python312._pth"
          if (-not (Test-Path $pth)) { throw "Embedded Python path configuration missing." }
          $rootFull = (Resolve-Path $root).Path
          $lines = Get-Content $pth
          if ($lines -notcontains $rootFull) { Add-Content -Path $pth -Value $rootFull }
          $pythonExe = (Resolve-Path (Join-Path $pythonDir "python.exe")).Path
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Python failed to start." }
          $probeCode = "import runpy,sys; sys.path.insert(0, sys.argv.pop(1)); runpy.run_module('scripts.apk_inspector', run_name='__main__')"
          & $pythonExe -c $probeCode $rootFull --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled APK inspector failed its startup check." }


      - name: Bundle the source-built Lunaria Windows x64 runtime
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRun = $null
          $deadline = (Get-Date).AddMinutes(100)
          while (-not $sourceRun -and (Get-Date) -lt $deadline) {
            $runsJson = gh run list --workflow build-nkk-lunaria-windows.yml --commit $env:SOURCE_COMMIT_SHA --repo $env:GITHUB_REPOSITORY --json databaseId,status,conclusion,headSha --limit 10
            if ($LASTEXITCODE -ne 0) { throw "Could not query the source-build workflow." }
            $runs = $runsJson | ConvertFrom-Json
            $sourceRun = $runs | Where-Object { $_.headSha -eq $env:SOURCE_COMMIT_SHA } | Select-Object -First 1
            if (-not $sourceRun) { Start-Sleep -Seconds 15 }
          }
          if (-not $sourceRun) { throw "Timed out waiting for the source-built Lunaria workflow." }

          while ($sourceRun.status -ne "completed" -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $runsJson = gh run list --workflow build-nkk-lunaria-windows.yml --commit $env:SOURCE_COMMIT_SHA --repo $env:GITHUB_REPOSITORY --json databaseId,status,conclusion,headSha --limit 10
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh the source-build workflow status." }
            $runs = $runsJson | ConvertFrom-Json
            $sourceRun = $runs | Where-Object { $_.headSha -eq $env:SOURCE_COMMIT_SHA } | Select-Object -First 1
          }
          if ($sourceRun.status -ne "completed" -or $sourceRun.conclusion -ne "success") {
            throw "Source-built Lunaria did not pass. Status=$($sourceRun.status); conclusion=$($sourceRun.conclusion)"
          }

          $artifactName = "NKK-Lunaria-Windows-x64-$env:SOURCE_COMMIT_SHA"
          $artifactRoot = Join-Path $PWD "lunaria-source-artifact"
          gh run download $sourceRun.databaseId --repo $env:GITHUB_REPOSITORY --name $artifactName --dir $artifactRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not download the successful source-build artifact." }
          $runtimeArtifactDir = Join-Path $artifactRoot "artifacts/lunaria-windows"
          $builtArchive = Get-ChildItem $runtimeArtifactDir -Filter "lunaria-*-windows-x86_64.zip" | Select-Object -First 1
          $sumsFile = Join-Path $runtimeArtifactDir "SHA256SUMS.txt"
          if (-not $builtArchive -or -not (Test-Path $sumsFile)) {
            throw "Source-build artifact is missing the runtime ZIP or its checksum file."
          }
          $builtZip = $builtArchive.FullName
          $expectedSha256 = ((Get-Content $sumsFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualSha256 = (Get-FileHash $builtZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Source-built Lunaria SHA-256 mismatch: $actualSha256" }
          if ((Get-Item $builtZip).Length -lt 10000000) { throw "Source-built Lunaria archive is unexpectedly small." }

          Expand-Archive $builtZip -DestinationPath runtime-source -Force
          $exe = Get-ChildItem runtime-source -Recurse -Filter lunaria.exe | Select-Object -First 1
          if (-not $exe) { throw "lunaria.exe missing from the source-built artifact." }
          $runtimeRoot = Join-Path (Resolve-Path "artifacts/DroidBox-win-x64").Path "runtime/Lunaria"
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") $runtimeRoot -Recurse -Force

          $frameworkZip = "platform-31_r01.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/$frameworkZip" -OutFile $frameworkZip
          $frameworkSha1 = (Get-FileHash $frameworkZip -Algorithm SHA1).Hash.ToLowerInvariant()
          if ($frameworkSha1 -ne "ca5bcaa565cb37e9d287051d6dd0e49a5426ec29") { throw "Android SDK Platform 31 archive SHA-1 mismatch: $frameworkSha1" }
          $frameworkRoot = Join-Path $runtimeRoot "runtime/framework-res"
          python scripts/install_framework_resources.py $frameworkZip $frameworkRoot
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $frameworkRoot "resources.arsc"))) { throw "Android framework resources were not installed." }

          $licenses = Join-Path $runtimeRoot "licenses"
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/yui0/lunaria/1d538e7e0ddab3074131cfbce6f9d0825764316e/LICENSE" -OutFile (Join-Path $licenses "Lunaria-MPL-2.0.txt")
          @(
            "Bundled runtime: NKK source-built Project Lunaria Windows x86_64 runtime.",
            "Lunaria source commit: 1d538e7e0ddab3074131cfbce6f9d0825764316e.",
            "Source build includes Windows-specific JNI varargs handling and debug information.",
            "Lunaria is licensed under Mozilla Public License 2.0. Source: https://github.com/yui0/lunaria",
            "Android SDK Platform 31 framework resources are copied unmodified from Google's android-12/android.jar after SHA-1 verification; see runtime/framework-res/SOURCE.txt and NOTICES/.",
            "APK execution is not sandboxed. Only run trusted Android packages."
          ) | Set-Content (Join-Path $runtimeRoot "THIRD-PARTY-NOTICES.txt")
          if (-not (Test-Path (Join-Path $runtimeRoot "lunaria.exe"))) { throw "Bundled source-built Lunaria executable missing." }
          "Bundled verified NKK source-built Lunaria runtime from workflow run $($sourceRun.databaseId)."
          "Source runtime SHA-256: $actualSha256"

      - name: Run native Windows Lunaria smoke test
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Get-ChildItem "artifacts/DroidBox-win-x64/runtime/Lunaria" -Recurse -Filter lunaria.exe | Select-Object -First 1
          if (-not $runtime) { throw "Lunaria executable missing before smoke test." }

          $smokeRun = $null
          $smokeDeadline = (Get-Date).AddMinutes(30)
          while (-not $smokeRun -and (Get-Date) -lt $smokeDeadline) {
            $runsJson = gh run list --workflow build-smoke-test-apk.yml --commit $env:SOURCE_COMMIT_SHA --repo $env:GITHUB_REPOSITORY --json databaseId,status,conclusion,headSha --limit 10
            if ($LASTEXITCODE -ne 0) { throw "Could not query the smoke APK build workflow." }
            $runs = $runsJson | ConvertFrom-Json
            $smokeRun = $runs | Where-Object { $_.headSha -eq $env:SOURCE_COMMIT_SHA } | Select-Object -First 1
            if (-not $smokeRun) { Start-Sleep -Seconds 10 }
          }
          if (-not $smokeRun) { throw "Timed out waiting for the smoke APK build." }

          while ($smokeRun.status -ne "completed" -and (Get-Date) -lt $smokeDeadline) {
            Start-Sleep -Seconds 10
            $runsJson = gh run list --workflow build-smoke-test-apk.yml --commit $env:SOURCE_COMMIT_SHA --repo $env:GITHUB_REPOSITORY --json databaseId,status,conclusion,headSha --limit 10
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh the smoke APK build status." }
            $runs = $runsJson | ConvertFrom-Json
            $smokeRun = $runs | Where-Object { $_.headSha -eq $env:SOURCE_COMMIT_SHA } | Select-Object -First 1
          }
          if ($smokeRun.status -ne "completed" -or $smokeRun.conclusion -ne "success") {
            throw "Smoke APK build did not pass. Status=$($smokeRun.status); conclusion=$($smokeRun.conclusion)"
          }

          $smokeArtifactName = "droidbox-smoke-test-apk-$env:SOURCE_COMMIT_SHA"
          gh run download $smokeRun.databaseId --repo $env:GITHUB_REPOSITORY --name $smokeArtifactName --dir smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Could not download the matching smoke-test APK." }
          $apk = Get-ChildItem smoke-test -Recurse -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw "Smoke-test APK artifact was not found." }
          $dataRoot = Join-Path $PWD "smoke-data"
          $cache = Join-Path $PWD "smoke-cache"
          $frames = Join-Path $PWD "smoke-frames"
          New-Item -ItemType Directory -Force -Path $dataRoot,$cache,$frames | Out-Null
          $env:LUNARIA_CACHE_DIR = $cache
          $env:LUNARIA_DUMP_DIR = $frames
          $env:LUNARIA_DUMP_FRAME = "0,60,120"
          $env:LUNARIA_COMP_SHOT_S = "0.000000001"
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $runtime.FullName
          $psi.WorkingDirectory = $runtime.Directory.FullName
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.ArgumentList.Add("--data-root")
          $psi.ArgumentList.Add($dataRoot)
          $psi.ArgumentList.Add($apk.FullName)
          $process = [System.Diagnostics.Process]::Start($psi)
          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()
          Start-Sleep -Seconds 2
          if (-not $process.WaitForExit(6000)) {
            "Runtime remained active for 8 seconds; stopping the smoke-test process." | Set-Content smoke-test-result.txt
            $process.Kill($true)
            $process.WaitForExit()
          } else {
            "Runtime exited with code $($process.ExitCode)." | Set-Content smoke-test-result.txt
          }
          $stdoutTask.GetAwaiter().GetResult() | Set-Content smoke-stdout.log
          $stderrTask.GetAwaiter().GetResult() | Set-Content smoke-stderr.log
          $runtimeLog = Get-Content smoke-stderr.log -Raw
          $requiredSignals = @(
            "init_host_egl: EGL 1.5 ready",
            "MainActivity.onResume()V",
            "[overlay] parsed guest document",
            "[java D/DroidBoxSmokeTest] JNI varargs regression probe"
          )
          foreach ($signal in $requiredSignals) {
            if (-not $runtimeLog.Contains($signal)) { throw "Lunaria smoke test did not reach required startup stage: $signal" }
          }
          if ($runtimeLog.Contains("[framework] resources unavailable")) { throw "Lunaria could not find Android framework resources. Check the Platform 31 bundle." }
          "PASS: EGL initialised, Android Activity reached onResume, guest UI parsed, and no missing-framework-resource warning was reported." | Add-Content smoke-test-result.txt
          $captured = @(Get-ChildItem $frames -Filter "comp_*.ppm" -ErrorAction SilentlyContinue)
          if ($captured.Count -gt 0) {
            $shot = $captured[-1] # Validate the final app frame, not the initial runtime loading splash.
            $bytes = [System.IO.File]::ReadAllBytes($shot.FullName)
            $newlineCount = 0
            $payloadStart = -1
            for ($index = 0; $index -lt $bytes.Length; $index++) {
              if ($bytes[$index] -eq 10) {
                $newlineCount++
                if ($newlineCount -eq 3) { $payloadStart = $index + 1; break }
              }
            }
            if ($payloadStart -lt 0 -or ($bytes.Length - $payloadStart) -lt 300) { throw "Compositor PPM screenshot has an invalid header or no pixel payload." }
            $sum = 0.0
            $colors = [System.Collections.Generic.HashSet[int]]::new()
            $samples = 0
            for ($index = $payloadStart; $index -lt $bytes.Length; $index += 96) {
              if (($index + 2) -ge $bytes.Length) { break }
              $red = [int]$bytes[$index]
              $green = [int]$bytes[$index + 1]
              $blue = [int]$bytes[$index + 2]
              $sum += ($red + $green + $blue) / 3.0
              [void]$colors.Add(($red -shl 16) -bor ($green -shl 8) -bor $blue)
              $samples++
            }
            $average = $sum / [Math]::Max(1,$samples)
            "Compositor screenshot $($shot.Name): average brightness=$([Math]::Round($average,2)), sampled colors=$($colors.Count)." | Add-Content smoke-test-result.txt
            if ($average -lt 3 -or $colors.Count -lt 8) { throw "Lunaria compositor screenshot is blank or black." }
            "PASS: non-black composed Windows app frame captured." | Add-Content smoke-test-result.txt
          } else {
            "No compositor PPM screenshot was emitted; EGL and Android UI lifecycle passed, but visible frame output remains unverified." | Add-Content smoke-test-result.txt
          }

      - name: Upload native Windows smoke-test logs and frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DroidBox-Lunaria-Windows-Smoke-Test
          path: |
            smoke-test-result.txt
            smoke-stdout.log
            smoke-stderr.log
            smoke-frames/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          $toolPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $toolPath
          $env:PATH += ";$toolPath"
          vpk --help

      - name: Package installable and updateable DroidBox
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.1.${{ github.run_number }}"
          vpk pack --packId NKK.DroidBox --packTitle "NKK DroidBox" --packAuthors "NKK" --icon windows/Assets/DroidBox.ico --packVersion $version --packDir artifacts/DroidBox-win-x64 --mainExe DroidBox.Windows.exe --outputDir artifacts/velopack --channel win --shortcuts Desktop,StartMenuRoot
          if (-not (Test-Path "artifacts/velopack/releases.win.json")) { throw "Velopack release feed was not generated." }
          if (-not (Get-ChildItem "artifacts/velopack" -Filter "*Setup.exe")) { throw "Velopack installer was not generated." }

      - name: Upload installer preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidBox-Velopack-Installer
          path: artifacts/velopack/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.1.${{ github.run_number }}"
          $tag = "v$version"
          $assets = @(Get-ChildItem "artifacts/velopack" -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No Velopack release assets found." }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DroidBox $version" --notes "Automated DroidBox Windows release from commit $env:GITHUB_SHA. Install with the Setup.exe file. Installed copies can check this public GitHub Releases feed for updates." --latest
